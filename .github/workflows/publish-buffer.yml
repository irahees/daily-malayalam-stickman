name: Publish Malayalam Short to Instagram + YouTube via Buffer

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful video-generation run ID (default: latest confirmed video)"
        required: true
        type: string
        default: "43255563877"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-buffer.yml"
  workflow_run:
    workflows: ["Daily Malayalam Stickman Creator"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: buffer-publish-${{ github.event.workflow_run.id || github.event.inputs.source_run_id || '43255563877' }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      VIDEO_ARTIFACT_DIR: ${{ runner.temp }}/buffer-artifact
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.source_run_id || '43255563877' }}

    steps:
      - name: Checkout publishing script
        uses: actions/checkout@v4

      - name: Verify Buffer API key
        shell: bash
        run: |
          if [ -z "${BUFFER_API_KEY}" ]; then
            echo "::error::BUFFER_API_KEY is missing from repository Actions secrets."
            exit 1
          fi

      - name: Download the selected video artifact
        uses: actions/download-artifact@v4
        with:
          name: malayalam-short-video
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/buffer-artifact

      - name: Prepare the video and story for publishing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/buffer-media"
          VIDEO="$(find "${VIDEO_ARTIFACT_DIR}" -type f -name '*.mp4' -print -quit)"
          STORY="$(find "${VIDEO_ARTIFACT_DIR}" -type f -name 'story.json' -print -quit)"
          if [ -z "$VIDEO" ] || [ -z "$STORY" ]; then
            echo "::error::The selected artifact must contain one MP4 and story.json."
            exit 1
          fi
          cp "$VIDEO" "${{ runner.temp }}/buffer-media/daily_malayalam_stickman.mp4"
          cp "$STORY" "${{ runner.temp }}/buffer-media/story.json"
          cp src/publish_buffer.py "${{ runner.temp }}/publish_buffer.py"

      - name: Host the video at a direct public HTTPS URL
        shell: bash
        run: |
          set -euo pipefail
          git checkout --orphan buffer-media
          git rm -rf . >/dev/null 2>&1 || true
          cp "${{ runner.temp }}/buffer-media/daily_malayalam_stickman.mp4" ./daily_malayalam_stickman.mp4
          git add daily_malayalam_stickman.mp4
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update public video media for Buffer"
          git push origin HEAD:buffer-media --force

      - name: Publish immediately through Buffer
        env:
          BUFFER_VIDEO_URL: https://raw.githubusercontent.com/${{ github.repository }}/buffer-media/daily_malayalam_stickman.mp4
        run: python "${{ runner.temp }}/publish_buffer.py"
