name: Weekly Malayalam Bulk Instagram Reels
on:
  schedule:
    - cron: "30 2 * * *" # Daily 08:00 IST; generation/storage only
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      SARVAM_TTS_SPEAKER: shubh
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Malayalam fonts
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y ffmpeg fonts-noto-core fonts-noto-extra libraqm-dev libharfbuzz-dev libfribidi-dev libjpeg-dev pkg-config
          fc-match -f '%{file}\n' 'Noto Sans Malayalam:lang=ml' | grep -q '/'

      - name: Install Python packages
        run: pip install --no-binary=Pillow -r requirements.txt
      - name: Verify Malayalam shaping support
        run: python -c "from PIL import ImageFont, features; assert features.check('raqm'), 'Pillow RAQM shaping support is required for Malayalam'; print('RAQM shaping enabled')"
      - name: Validate Sarvam key
        run: test -n "$SARVAM_API_KEY"
      - name: Generate seven videos and growth tracker
        run: python src/create_batch.py
      - name: Verify batch
        run: |
          set -euo pipefail
          test "$(find output/batch -maxdepth 1 -name '*.mp4' | wc -l)" -eq 7
          test -s output/batch/07_tracker.csv
          for f in output/batch/*.mp4; do
            test -s "$f"
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: malayalam-weekly-reels
          path: output/batch/*
          if-no-files-found: error
          retention-days: 14
