name: Daily Malayalam Video Batch
on:
  schedule:
    - cron: "30 2 * * *" # Daily 08:00 IST; generation and storage only
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-malayalam-video-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Prevent duplicate generation on the same UTC/IST date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq "[.artifacts[] | select(.name == \"malayalam-daily-reels\" and .expired == false and (.created_at | startswith(\"$today\")))] | length")"
          if [ "$existing" -gt 0 ]; then
            echo "::error::A daily batch artifact already exists for $today UTC/IST; reuse it instead of regenerating."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Malayalam fonts
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y blender ffmpeg fonts-noto-core fonts-noto-extra libraqm-dev libegl1 libgl1 libxrender1 libxext6 libxi6 libxfixes3 libharfbuzz-dev libfribidi-dev libjpeg-dev pkg-config
          fc-match -f '%{file}\\n' 'Noto Sans Malayalam:lang=ml' | grep -q '/'
      - name: Install Python packages
        run: pip install --no-binary=Pillow -r requirements.txt
      - name: Verify Malayalam shaping support
        run: python -c "from PIL import features; assert features.check('raqm'), 'Pillow RAQM shaping support is required for Malayalam'; print('RAQM shaping enabled')"
      - name: Generate six distinct videos and append the growth tracker
        run: python src/create_batch.py
      - name: Normalize six videos to 1080x1920 at 30 FPS before storage
        shell: bash
        run: |
          set -euo pipefail
          for f in output/batch/*.mp4; do
            tmp="${f%.mp4}.normalized.mp4"
            ffmpeg -hide_banner -loglevel error -y -i "$f" -map 0:v:0 -map '0:a?' \
              -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p" \
              -c:v libx264 -preset veryfast -crf 20 -r 30 -fps_mode cfr \
              -c:a aac -b:a 192k -movflags +faststart "$tmp"
            mv "$tmp" "$f"
          done
      - name: Verify six videos, metadata, captions, SEO and tracker
        run: |
          set -euo pipefail
          test "$(find output/batch -maxdepth 1 -name '*.mp4' | wc -l)" -eq 6
          test "$(find output/batch -maxdepth 1 -name '*.json' | wc -l)" -eq 6
          test -s output/batch/07_tracker.csv
          for f in output/batch/*.mp4; do
            test -s "$f"
            test -s "${f%.mp4}.json"
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" | grep -Eq '^[0-9]+([.][0-9]+)?$'
            probe="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of default=noprint_wrappers=1 "$f")"
            grep -Fxq 'width=1080' <<<"$probe"
            grep -Fxq 'height=1920' <<<"$probe"
            grep -Fxq 'avg_frame_rate=30/1' <<<"$probe"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: malayalam-daily-reels
          path: output/batch/*
          if-no-files-found: error
          retention-days: 14
      - name: Persist tracker history without starting another generation run
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracking/07_tracker.csv
          if git diff --cached --quiet; then
            echo "Tracker already up to date."
          else
            git commit -m "Update Malayalam video tracking ledger"
            git push origin HEAD:main
          fi
