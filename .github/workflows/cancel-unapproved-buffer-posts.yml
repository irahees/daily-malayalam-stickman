name: Adjust Buffer cadence to four weekly posts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cancel the four exact Tuesday and Thursday overflow posts
        run: python src/cancel_unapproved_posts.py
