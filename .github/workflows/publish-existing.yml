name: Publish Existing Malayalam Video

on:
  workflow_dispatch:
    inputs:
      video_run_id:
        description: "Successful video-generation run ID"
        required: true
        default: "43256850512"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-existing.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-existing-malayalam-video
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      VIDEO_ARTIFACT_DIR: video-artifact
    steps:
      - name: Checkout publishing script
        uses: actions/checkout@v4
      - name: Verify Buffer API key
        shell: bash
        run: |
          if [ -z "${BUFFER_API_KEY}" ]; then
            echo "::error::BUFFER_API_KEY is missing from repository Actions secrets."
            exit 1
          fi
      - name: Download selected video artifact
        uses: actions/download-artifact@v4
        with:
          name: malayalam-short-video
          path: video-artifact
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.video_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate artifact
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find video-artifact -type f -name '*.mp4' -print -quit)"
          STORY="$(find video-artifact -type f -name 'story.json' -print -quit)"
          if [ -z "$VIDEO" ] || [ -z "$STORY" ]; then
            echo "::error::The selected artifact must contain an MP4 and story.json."
            exit 1
          fi
      - name: Host video as a public GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find video-artifact -type f -name '*.mp4' -print -quit)"
          TAG="manual-video-${GITHUB_RUN_ID}"
          ASSET="daily_malayalam_stickman-${GITHUB_RUN_ID}.mp4"
          gh release create "$TAG" "$VIDEO#$ASSET" --title "Manual Malayalam Short ${GITHUB_RUN_ID}" --notes "Selected for Buffer publishing."
          echo "BUFFER_VIDEO_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}" >> "$GITHUB_ENV"
      - name: Publish through Buffer
        run: python src/publish_buffer.py
