name: Prepare Existing Malayalam Video for Review

on:
  workflow_dispatch:
    inputs:
      video_run_id:
        description: "Successful video-generation run ID"
        required: true
        default: "43256850512"

permissions:
  contents: read
  actions: read

jobs:
  prepare-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download selected video artifact
        uses: actions/download-artifact@v4
        with:
          name: malayalam-short-video
          path: video-artifact
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.video_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and normalize video
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find video-artifact -type f -name '*.mp4' -print -quit)"
          STORY="$(find video-artifact -type f -name 'story.json' -print -quit)"
          if [ -z "$VIDEO" ] || [ -z "$STORY" ]; then
            echo "::error::The selected artifact must contain an MP4 and story.json."
            exit 1
          fi
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y ffmpeg
          mkdir -p review-output
          ffmpeg -y -i "$VIDEO" -map 0:v:0 -map '0:a?' -vf "fps=30,scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -fps_mode cfr -c:a aac -b:a 192k -movflags +faststart review-output/daily_malayalam_stickman.mp4
          test -s review-output/daily_malayalam_stickman.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,width,height,r_frame_rate -of json review-output/daily_malayalam_stickman.mp4

      - name: Upload review artifact only
        uses: actions/upload-artifact@v4
        with:
          name: malayalam-short-video-review
          path: review-output/daily_malayalam_stickman.mp4
          if-no-files-found: error
          retention-days: 7
