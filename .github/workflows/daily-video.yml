name: Daily Malayalam Stickman Creator

on:
  schedule:
    # 07:00 IST every day (01:30 UTC)
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      upload_to_youtube:
        description: "Upload a Private test video to the connected YouTube channel"
        required: true
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_TTS_MODEL: eleven_v3
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_STORY_MODEL: openai/gpt-oss-20b
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Groq and ElevenLabs secrets
        run: |
          test -n "$GROQ_API_KEY" || { echo "::error::GROQ_API_KEY is missing."; exit 1; }
          test -n "$ELEVENLABS_API_KEY" || { echo "::error::ELEVENLABS_API_KEY is missing."; exit 1; }
          test -n "$ELEVENLABS_VOICE_ID" || { echo "::error::ELEVENLABS_VOICE_ID is missing."; exit 1; }

      - name: Render Malayalam video with Groq and ElevenLabs
        run: python src/create_video.py

      - name: Upload Private test video to YouTube
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_youtube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -z "$YOUTUBE_CLIENT_ID" ] || [ -z "$YOUTUBE_CLIENT_SECRET" ] || [ -z "$YOUTUBE_REFRESH_TOKEN" ]; then
            echo "::error::Missing one or more YouTube OAuth secrets."
            exit 1
          fi
          python src/upload_youtube.py

      - name: Upload test video and narration
        uses: actions/upload-artifact@v4
        with:
          name: groq-elevenlabs-stickman-video
          path: |
            output/daily_malayalam_stickman.mp4
            output/narration.wav
            output/story.json
          if-no-files-found: error
          retention-days: 7
