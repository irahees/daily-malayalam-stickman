name: Daily Malayalam Stickman Creator

on:
  schedule:
    # 07:00 IST every day (01:30 UTC)
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      upload_to_youtube:
        description: "Upload a Private test video to the connected YouTube channel"
        required: true
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_TTS_MODEL: eleven_v3
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_STORY_MODEL: gpt-4o-mini
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check OpenAI and ElevenLabs secrets
        run: |
          test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY is missing. Add it in GitHub Actions secrets."; exit 1; }
          test -n "$ELEVENLABS_API_KEY" || { echo "::error::ELEVENLABS_API_KEY is missing."; exit 1; }
          test -n "$ELEVENLABS_VOICE_ID" || { echo "::error::ELEVENLABS_VOICE_ID is missing."; exit 1; }

      - name: Install OpenCode CLI
        run: npm install --global opencode-ai

      - name: OpenCode creative director
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          test -n "$OPENCODE_API_KEY" || { echo "::error::OPENCODE_API_KEY is missing. Add it in GitHub Actions secrets."; exit 1; }
          mkdir -p output
          opencode run --standalone --model opencode/gpt-5.6-sol "Act as the creative director for a Malayalam YouTube Shorts channel for Kerala viewers. Choose one highly compelling, original 45-60 second video topic with a curiosity gap. Prefer surprising Kerala/India what-if scenarios, everyday economics, science/technology curiosities, or useful facts. Do not present hypotheticals as real events. Do not invent current trends, statistics, dates, or factual claims. Return ONLY valid JSON with exactly these string fields: topic, angle, hook. Write all three values in natural Malayalam. The hook must be a short question suitable for the first 1.2 seconds. No markdown." > output/opencode_brief.json
          python -c "import json; d=json.load(open('output/opencode_brief.json', encoding='utf-8')); assert all(isinstance(d.get(k), str) and d[k].strip() for k in ('topic','angle','hook')); print('OpenCode brief validated:', d['topic'])"

      - name: Render Malayalam video with OpenCode direction, OpenAI and ElevenLabs
        run: python src/create_video.py

      - name: Upload Private test video to YouTube
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_youtube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -z "$YOUTUBE_CLIENT_ID" ] || [ -z "$YOUTUBE_CLIENT_SECRET" ] || [ -z "$YOUTUBE_REFRESH_TOKEN" ]; then
            echo "::error::Missing one or more YouTube OAuth secrets."
            exit 1
          fi
          python src/upload_youtube.py

      - name: Upload test video and narration
        uses: actions/upload-artifact@v4
        with:
          name: openai-elevenlabs-stickman-video
          path: |
            output/daily_malayalam_stickman.mp4
            output/narration.wav
            output/story.json
          if-no-files-found: error
          retention-days: 7
