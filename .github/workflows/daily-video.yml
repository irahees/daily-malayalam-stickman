name: Daily Malayalam Stickman Creator

on:
  schedule:
    # Daily at 7:00 AM IST (01:30 UTC)
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: daily-malayalam-video
  cancel-in-progress: true

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_STORY_MODEL: gpt-4o-mini
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_TTS_MODEL: eleven_v3
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Malayalam-compatible fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          for key in OPENAI_API_KEY OPENCODE_API_KEY ELEVENLABS_API_KEY ELEVENLABS_VOICE_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is missing from GitHub Actions repository secrets."
              exit 1
            fi
          done

      - name: Install OpenCode CLI
        run: npm install --global opencode-ai

      - name: Create creative brief with OpenCode
        run: |
          mkdir -p output
          opencode run --standalone --model opencode/gpt-5.6-sol "Act as the creative director for a Malayalam Shorts channel for Kerala viewers. Choose one original, compelling 45-60 second topic with a curiosity gap. Prefer surprising Kerala/India what-if scenarios, everyday economics, science/technology curiosities, or useful facts. Clearly label hypotheticals; never present them as real events. Do not invent current trends, statistics, dates, or factual claims. Return ONLY valid JSON with exactly three non-empty string fields: topic, angle, hook. Write all three in natural Malayalam. The hook must work in the first 1.2 seconds. No markdown." > output/opencode_brief.json
          python -c "import json; d=json.load(open('output/opencode_brief.json', encoding='utf-8')); assert all(isinstance(d.get(k), str) and d[k].strip() for k in ('topic','angle','hook')); print('Brief validated:', d['topic'])"

      - name: Generate Malayalam story, narration and MP4
        run: python src/create_video.py

      - name: Verify output video
        run: |
          test -s output/daily_malayalam_stickman.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/daily_malayalam_stickman.mp4

      - name: Save generated video artifact
        uses: actions/upload-artifact@v4
        with:
          name: malayalam-short-video
          path: |
            output/daily_malayalam_stickman.mp4
            output/narration.wav
            output/story.json
            output/opencode_brief.json
          if-no-files-found: error
          retention-days: 7
