name: Daily Malayalam Stickman Creator

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/daily-video.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-malayalam-video
  cancel-in-progress: false

jobs:
  create-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_MODEL: gemini-3.8-flash-tts
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      SARVAM_TTS_SPEAKER: shubh
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Malayalam-compatible fonts
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y ffmpeg fonts-noto-core
          command -v ffmpeg
          command -v ffprobe
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate at least one Malayalam TTS provider
        shell: bash
        run: |
          if [ -z "${GEMINI_API_KEY}" ] && [ -z "${SARVAM_API_KEY}" ]; then
            echo "::error::Add GEMINI_API_KEY or SARVAM_API_KEY to repository Actions secrets."
            exit 1
          fi
      - name: Select offline Malayalam script
        run: python src/create_brief.py
      - name: Generate Malayalam narration and MP4
        run: python src/create_video.py
      - name: Verify output video
        run: |
          test -s output/daily_malayalam_stickman.mp4
          test -s output/story.json
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/daily_malayalam_stickman.mp4
      - name: Save generated video artifact
        uses: actions/upload-artifact@v4
        with:
          name: malayalam-short-video
          path: |
            output/daily_malayalam_stickman.mp4
            output/narration.wav
            output/story.json
            output/creative_brief.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: create-video
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      VIDEO_ARTIFACT_DIR: video-artifact
    steps:
      - name: Checkout publishing script
        uses: actions/checkout@v4
      - name: Verify Buffer API key
        shell: bash
        run: |
          if [ -z "${BUFFER_API_KEY}" ]; then
            echo "::error::BUFFER_API_KEY is missing from GitHub Actions repository secrets."
            exit 1
          fi
      - name: Download this run's video artifact
        uses: actions/download-artifact@v4
        with:
          name: malayalam-short-video
          path: video-artifact
      - name: Prepare public video file
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find "${VIDEO_ARTIFACT_DIR}" -type f -name '*.mp4' -print -quit)"
          STORY="$(find "${VIDEO_ARTIFACT_DIR}" -type f -name 'story.json' -print -quit)"
          if [ -z "$VIDEO" ] || [ -z "$STORY" ]; then
            echo "::error::The artifact must contain an MP4 and story.json."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/buffer-media"
          ffmpeg -y -i "$VIDEO" -map 0:v:0 -map '0:a?' -vf "fps=30,format=yuv420p" -c:v libx264 -preset veryfast -crf 20 -r 30 -fps_mode cfr -c:a aac -b:a 192k -movflags +faststart "$RUNNER_TEMP/buffer-media/daily_malayalam_stickman.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate,avg_frame_rate -of default=noprint_wrappers=1 "$RUNNER_TEMP/buffer-media/daily_malayalam_stickman.mp4"
      - name: Preserve Buffer publisher before switching branches
        run: cp src/publish_buffer.py "$RUNNER_TEMP/publish_buffer.py"
      - name: Host video as a public GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find "${VIDEO_ARTIFACT_DIR}" -type f -name '*.mp4' -print -quit)"
          TAG="daily-video-${GITHUB_RUN_ID}"
          ASSET="daily_malayalam_stickman-${GITHUB_RUN_ID}.mp4"
          cp "$RUNNER_TEMP/buffer-media/daily_malayalam_stickman.mp4" "$RUNNER_TEMP/$ASSET"
          gh release create "$TAG" "$RUNNER_TEMP/$ASSET#Daily Malayalam Short" --title "Daily Malayalam Short ${GITHUB_RUN_ID}" --notes "Generated by the Daily Malayalam Stickman workflow."
          echo "BUFFER_VIDEO_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}" >> "$GITHUB_ENV"
      - name: Publish immediately through Buffer
        run: python "$RUNNER_TEMP/publish_buffer.py"
