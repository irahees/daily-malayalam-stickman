name: Stickman video test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_MODEL: gemini-3.8-flash-tts
      GEMINI_TTS_VOICE: Kore
      GEMINI_STORY_MODEL: gemini-2.5-flash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Gemini API secret
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is missing. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Render sample video with Gemini TTS
        run: python src/create_video.py

      - name: Upload test video and narration
        uses: actions/upload-artifact@v4
        with:
          name: gemini-tts-stickman-test
          path: |
            output/daily_malayalam_stickman.mp4
            output/narration.wav
            output/story.json
          if-no-files-found: error
          retention-days: 3
