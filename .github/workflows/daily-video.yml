name: Daily Malayalam Stickman Creator

on:
  schedule:
    # Daily at 7:00 AM IST (01:30 UTC)
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - 'src/publish_buffer.py'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: daily-malayalam-video
  cancel-in-progress: false

jobs:
  create-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_MODEL: gemini-3.8-flash-tts
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Malayalam-compatible fonts
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y ffmpeg fonts-noto-core
          command -v ffmpeg
          command -v ffprobe

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Gemini TTS secret
        shell: bash
        run: |
          for key in GEMINI_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is missing from GitHub Actions repository secrets."
              exit 1
            fi
          done

      - name: Select offline Malayalam script
        run: python src/create_brief.py

      - name: Generate Malayalam narration and MP4 with Gemini TTS
        run: python src/create_video.py

      - name: Verify output video
        run: |
          test -s output/daily_malayalam_stickman.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/daily_malayalam_stickman.mp4

      - name: Save generated video artifact (private review only)
        uses: actions/upload-artifact@v4
        with:
          name: malayalam-short-video
          path: |
            output/daily_malayalam_stickman.mp4
            output/narration.wav
            output/story.json
            output/creative_brief.json
          if-no-files-found: error
          retention-days: 7
