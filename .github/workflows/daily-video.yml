name: Daily Malayalam Stickman Creator

on:
  schedule:
    # Daily at 7:00 AM IST (01:30 UTC)
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: daily-malayalam-video
  cancel-in-progress: false

jobs:
  create-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_STORY_MODEL: gpt-4o-mini
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_TTS_MODEL: eleven_v3
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Malayalam-compatible fonts
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y ffmpeg fonts-noto-core
          command -v ffmpeg
          command -v ffprobe

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          for key in OPENAI_API_KEY ELEVENLABS_API_KEY ELEVENLABS_VOICE_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is missing from GitHub Actions repository secrets."
              exit 1
            fi
          done

      - name: Create creative brief with OpenAI
        run: python src/create_brief.py

      - name: Generate Malayalam story, narration and MP4
        run: python src/create_video.py

      - name: Verify output video
        run: |
          test -s output/daily_malayalam_stickman.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/daily_malayalam_stickman.mp4

      - name: Publish MP4 as a public GitHub Release asset
        id: public-video
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="daily-video-${GITHUB_RUN_ID}"
          TITLE="Daily Malayalam Short — $(TZ=Asia/Kolkata date +'%Y-%m-%d')"
          gh release create "$TAG" output/daily_malayalam_stickman.mp4 \
            --title "$TITLE" \
            --notes "Automatically generated Malayalam short. Review before publishing."
          ASSET_URL="https://github.com/${GH_REPO}/releases/download/${TAG}/daily_malayalam_stickman.mp4"
          echo "url=$ASSET_URL" >> "$GITHUB_OUTPUT"
          echo "Public video URL created: $ASSET_URL"

      - name: Verify Buffer connection and prepare social drafts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          PUBLIC_VIDEO_URL: ${{ steps.public-video.outputs.url }}
          BUFFER_MODE: ${{ github.event_name == 'push' && 'verify' || 'draft' }}
        run: |
          set -euo pipefail
          if [ -z "${BUFFER_API_KEY:-}" ]; then
            echo "::error::BUFFER_API_KEY is missing from GitHub Actions repository secrets."
            exit 1
          fi
          curl --fail --location --silent --show-error --head "$PUBLIC_VIDEO_URL" >/dev/null
          python src/buffer_publish.py "$BUFFER_MODE"

      - name: Save generated video artifact
        uses: actions/upload-artifact@v4
        with:
          name: malayalam-short-video
          path: |
            output/daily_malayalam_stickman.mp4
            output/narration.wav
            output/story.json
            output/opencode_brief.json
          if-no-files-found: error
          retention-days: 7
