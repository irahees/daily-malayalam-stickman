name: Stickman video test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render sample video
        run: python src/create_video.py

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: sample-stickman-video
          path: output/daily_malayalam_stickman.mp4
          if-no-files-found: error
          retention-days: 3
